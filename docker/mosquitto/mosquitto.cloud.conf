# Azure cloud MQTT configuration.
# Require authentication for all clients.
allow_anonymous false
password_file /mosquitto/secrets/passwd

# Store persistent MQTT messages.
persistence true
persistence_location /mosquitto/data/

# Internal plaintext listener for Docker services only.
# Port 1883 will NOT be published to the internet.
listener 1883 0.0.0.0

# Secure MQTT listener for ESP32 and remote clients.
listener 8883 0.0.0.0
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Send logs to Docker.
log_dest stdout
